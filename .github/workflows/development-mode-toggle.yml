name: "Toggle Development Mode"

on:
  # 1) Called by other workflows
  workflow_call:
    inputs:
      mode:
        description: "Enable or disable dev mode (reusable)."
        type: string
        required: true
        default: "enable"
      minimum_supported_lv_version:
        description: "LabVIEW major version (2020-2025)."
        type: string
        required: false
        default: "2021"
      run_pester:
        description: "Run Pester integration tests (LabVIEW 2021)."
        type: boolean
        required: false
        default: false

  # 2) Triggered manually from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Enable or disable dev mode (manual)."
        required: true
        default: "enable"
        type: choice
        options:
          - enable
          - disable
      minimum_supported_lv_version:
        description: "LabVIEW major version."
        required: false
        default: "2021"
        type: choice
        options:
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
      run_pester:
        description: "Run Pester integration tests (LabVIEW 2021)."
        required: false
        default: false
        type: boolean

jobs:
  toggle-dev-mode:
    #
    # -- FULLY DYNAMIC JOB NAME --
    #
    # If triggered by 'workflow_dispatch', read `github.event.inputs.mode`.
    # Otherwise (workflow_call), read `inputs.mode`.
    # Then display "Enable Dev Mode" or "Disable Dev Mode."
    #
    name: ${{ 
      github.event_name == 'workflow_dispatch' && 
        (github.event.inputs.mode == 'enable' && 'Enable Dev Mode' || 'Disable Dev Mode') || 
        (inputs.mode == 'enable' && 'Enable Dev Mode' || 'Disable Dev Mode') }}

    runs-on: [self-hosted-windows-lv]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log context
        shell: pwsh
        run: |
          Write-Host "Actor: ${{ github.actor }}"
          Write-Host "Reference: ${{ github.ref }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            Write-Host "Pull Request Number: ${{ github.event.pull_request.number }}"
          } else {
            Write-Host "Not triggered by a pull request."
          }

      - name: Diagnostics before dev-mode toggle (64-bit)
        id: diag_before_64
        uses: ./.github/actions/icon-editor-files-in-lv-installation
        with:
          lv-ver: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}
          arch: "64"
          summary-title: "Icon Editor Files (before dev-mode toggle, 64-bit)"
          artifact-name: icon-editor-files-before-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}-64

      - name: Snapshot diagnostics before (64-bit)
        shell: pwsh
        run: |
          Copy-Item -Path "${{ steps.diag_before_64.outputs.csv-path }}" `
            -Destination "$env:GITHUB_WORKSPACE\\icon-editor-files-before.csv" -Force

      - name: Toggle dev mode (64-bit)
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = '${{ github.event.inputs.mode }}'
            $lvVersion = '${{ github.event.inputs.minimum_supported_lv_version }}'
          } else {
            $mode = '${{ inputs.mode }}'
            $lvVersion = '${{ inputs.minimum_supported_lv_version }}'
          }

          if ([string]::IsNullOrWhiteSpace($lvVersion)) {
            $lvVersion = '2021'
          }

          $scriptArgs = @{
            MinimumSupportedLVVersion = $lvVersion
            SupportedBitness          = '64'
          }

          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            $scriptArgs.RelativePath = $env:GITHUB_WORKSPACE
          }

          if ($mode -eq 'enable') {
            & ./.github/actions/set-development-mode/Set_Development_Mode.ps1 @scriptArgs
          } else {
            & ./.github/actions/revert-development-mode/RevertDevelopmentMode.ps1 @scriptArgs
          }

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            exit $LASTEXITCODE
          }

      - name: Diagnostics after dev-mode toggle (64-bit)
        id: diag_after_64
        uses: ./.github/actions/icon-editor-files-in-lv-installation
        if: ${{ success() }}
        with:
          lv-ver: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}
          arch: "64"
          summary-title: "Icon Editor Files (after dev-mode toggle, 64-bit)"
          artifact-name: icon-editor-files-after-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}-64

      - name: Snapshot diagnostics after (64-bit)
        if: ${{ success() }}
        shell: pwsh
        run: |
          Copy-Item -Path "${{ steps.diag_after_64.outputs.csv-path }}" `
            -Destination "$env:GITHUB_WORKSPACE\\icon-editor-files-after.csv" -Force

      - name: Validate dev-mode toggle (64-bit)
        if: ${{ success() }}
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = '${{ github.event.inputs.mode }}'
            $lvVersion = '${{ github.event.inputs.minimum_supported_lv_version }}'
          } else {
            $mode = '${{ inputs.mode }}'
            $lvVersion = '${{ inputs.minimum_supported_lv_version }}'
          }

          if ([string]::IsNullOrWhiteSpace($lvVersion)) {
            $lvVersion = '2021'
          }

          & .\.github\actions\icon-editor-files-in-lv-installation\Validate-IconEditorDiagnostics.ps1 `
            -Mode $mode `
            -CsvPath "$env:GITHUB_WORKSPACE\\icon-editor-files-after.csv" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -Bitness 64 `
            -LabVIEWVersion $lvVersion

      - name: Compare diagnostics before/after (64-bit)
        if: ${{ always() }}
        shell: pwsh
        run: |
          & .\.github\actions\icon-editor-files-in-lv-installation\Compare-IconEditorFilesCsv.ps1 `
            -BeforeCsv "$env:GITHUB_WORKSPACE\\icon-editor-files-before.csv" `
            -AfterCsv "$env:GITHUB_WORKSPACE\\icon-editor-files-after.csv" `
            -SummaryTitle "Icon Editor Files Diff (dev-mode toggle, 64-bit)" `
            -IncludeGitMetadata `
            -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Diagnostics before dev-mode toggle (32-bit)
        id: diag_before_32
        uses: ./.github/actions/icon-editor-files-in-lv-installation
        if: ${{ success() }}
        with:
          lv-ver: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}
          arch: "32"
          summary-title: "Icon Editor Files (before dev-mode toggle, 32-bit)"
          artifact-name: icon-editor-files-before-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}-32

      - name: Snapshot diagnostics before (32-bit)
        if: ${{ success() }}
        shell: pwsh
        run: |
          Copy-Item -Path "${{ steps.diag_before_32.outputs.csv-path }}" `
            -Destination "$env:GITHUB_WORKSPACE\\icon-editor-files-before-32.csv" -Force

      - name: Toggle dev mode (32-bit)
        if: ${{ success() }}
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = '${{ github.event.inputs.mode }}'
            $lvVersion = '${{ github.event.inputs.minimum_supported_lv_version }}'
          } else {
            $mode = '${{ inputs.mode }}'
            $lvVersion = '${{ inputs.minimum_supported_lv_version }}'
          }

          if ([string]::IsNullOrWhiteSpace($lvVersion)) {
            $lvVersion = '2021'
          }

          $scriptArgs = @{
            MinimumSupportedLVVersion = $lvVersion
            SupportedBitness          = '32'
          }

          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            $scriptArgs.RelativePath = $env:GITHUB_WORKSPACE
          }

          if ($mode -eq 'enable') {
            & ./.github/actions/set-development-mode/Set_Development_Mode.ps1 @scriptArgs
          } else {
            & ./.github/actions/revert-development-mode/RevertDevelopmentMode.ps1 @scriptArgs
          }

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            exit $LASTEXITCODE
          }

      - name: Diagnostics after dev-mode toggle (32-bit)
        id: diag_after_32
        uses: ./.github/actions/icon-editor-files-in-lv-installation
        if: ${{ success() }}
        with:
          lv-ver: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}
          arch: "32"
          summary-title: "Icon Editor Files (after dev-mode toggle, 32-bit)"
          artifact-name: icon-editor-files-after-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minimum_supported_lv_version || inputs.minimum_supported_lv_version }}-32

      - name: Snapshot diagnostics after (32-bit)
        if: ${{ success() }}
        shell: pwsh
        run: |
          Copy-Item -Path "${{ steps.diag_after_32.outputs.csv-path }}" `
            -Destination "$env:GITHUB_WORKSPACE\\icon-editor-files-after-32.csv" -Force

      - name: Validate dev-mode toggle (32-bit)
        if: ${{ success() }}
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = '${{ github.event.inputs.mode }}'
            $lvVersion = '${{ github.event.inputs.minimum_supported_lv_version }}'
          } else {
            $mode = '${{ inputs.mode }}'
            $lvVersion = '${{ inputs.minimum_supported_lv_version }}'
          }

          if ([string]::IsNullOrWhiteSpace($lvVersion)) {
            $lvVersion = '2021'
          }

          & .\.github\actions\icon-editor-files-in-lv-installation\Validate-IconEditorDiagnostics.ps1 `
            -Mode $mode `
            -CsvPath "$env:GITHUB_WORKSPACE\\icon-editor-files-after-32.csv" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -Bitness 32 `
            -LabVIEWVersion $lvVersion

      - name: Compare diagnostics before/after (32-bit)
        if: ${{ always() }}
        shell: pwsh
        run: |
          & .\.github\actions\icon-editor-files-in-lv-installation\Compare-IconEditorFilesCsv.ps1 `
            -BeforeCsv "$env:GITHUB_WORKSPACE\\icon-editor-files-before-32.csv" `
            -AfterCsv "$env:GITHUB_WORKSPACE\\icon-editor-files-after-32.csv" `
            -SummaryTitle "Icon Editor Files Diff (dev-mode toggle, 32-bit)" `
            -IncludeGitMetadata `
            -RepoRoot "$env:GITHUB_WORKSPACE"
      #
      # -- SET OUTPUT (JSON) IF SUCCESS --
      # Using multiline syntax to handle multi-line JSON safely
      #
      - name: Set environment_details output
        if: ${{ success() }}
        id: set_output
        shell: pwsh
        run: |
          # Determine final mode for the JSON output
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $mode = '${{ github.event.inputs.mode }}'
          } else {
            $mode = '${{ inputs.mode }}'
          }

          $actor     = '${{ github.actor }}'
          $timestamp = (Get-Date -Format o)  # ISO8601 UTC
          $osInfo    = [System.Environment]::OSVersion.VersionString

          if ('${{ github.event_name }}' -eq 'pull_request') {
            $prNumber = '${{ github.event.pull_request.number }}'
          } else {
            $prNumber = 'N/A'
          }

          # Pretty-printed JSON (multi-line)
          $jsonObject = [ordered]@{
            mode      = $mode
            timestamp = $timestamp
            actor     = $actor
            pr_number = $prNumber
            os        = $osInfo
          } | ConvertTo-Json

          Write-Host "JSON Output: $jsonObject"

          # Write multiline output to GITHUB_OUTPUT:
          echo "environment_details<<EOF" >> $env:GITHUB_OUTPUT
          echo "$jsonObject"             >> $env:GITHUB_OUTPUT
          echo "EOF"                     >> $env:GITHUB_OUTPUT

      - name: Run Pester integration tests (LabVIEW 2021)
        if: ${{ success() && ((github.event.inputs.run_pester == 'true') || (inputs.run_pester == true)) && ((github.event.inputs.mode == 'enable') || (inputs.mode == 'enable')) }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\Test\Pester\Run-Pester.ps1 -LabVIEWVersion 2021 -CI

    outputs:
      environment_details: ${{ steps.set_output.outputs.environment_details }}
