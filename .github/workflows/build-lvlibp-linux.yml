name: Build LVLIBP with Docker

on:
  push:
    branches:
      - main
      - develop
      - release-alpha/*
      - release-beta/*
      - release-rc/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
      - release-alpha/*
      - release-beta/*
      - release-rc/*
      - hotfix/*
  workflow_dispatch:

jobs:
  build-lvlibp:
    name: Build LabVIEW Packed Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Version from Git
        id: version
        shell: pwsh
        run: |
          git fetch --tags
          $allTags = git tag -l "v*.*.*" --sort=-version:refname 2>$null
          $tag = if ($allTags) { $allTags | Select-Object -First 1 } else { $null }
          
          Write-Host "Latest tag in repository: '$tag'"
          
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "No version tag found. Using fallback version 0.0.0.0"
            $major = 0
            $minor = 0
            $patch = 0
            $build = 0
          } elseif ($tag -match '^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$') {
            $major = $Matches[1]
            $minor = $Matches[2]
            $patch = $Matches[3]
            $build = if ($Matches[4]) { $Matches[4] } else { 0 }
            Write-Host "Parsed version from tag '$tag': $major.$minor.$patch.$build"
          } else {
            Write-Warning "Tag '$tag' does not match pattern v{major}.{minor}.{patch}[.{build}]. Using fallback 0.0.0.0"
            $major = 0
            $minor = 0
            $patch = 0
            $build = 0
          }

          Write-Host "Version: $major.$minor.$patch.$build"
          
          echo "major=$major" >> $env:GITHUB_OUTPUT
          echo "minor=$minor" >> $env:GITHUB_OUTPUT
          echo "patch=$patch" >> $env:GITHUB_OUTPUT
          echo "build=$build" >> $env:GITHUB_OUTPUT
      
      - name: Build PPL with Docker
        uses: ni/open-source/build-lvlibp-docker-linux@actions
        with:
          minimum_supported_lv_version: '2026'
          supported_bitness: '64'
          project_path: 'lv_icon_editor.lvproj'
          target_name: 'My Computer'
          build_spec_name: 'Editor Packed Library'
          major: ${{ steps.version.outputs.major }}
          minor: ${{ steps.version.outputs.minor }}
          patch: ${{ steps.version.outputs.patch }}
          build: ${{ steps.version.outputs.build }}
          commit: ${{ github.sha }}
          docker_image: 'nationalinstruments/labview'
          image_tag: '2026q1-linux'

      - name: Upload Built PPL
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: lv_icon_x64_v${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}.${{ steps.version.outputs.build }}
          path: builds/*.lvlibp
          retention-days: 7

      - name: Upload Build Logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-logs
          path: |
            **/*.log
          retention-days: 3