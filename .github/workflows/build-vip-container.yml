name: Build VIP with shared ni/open-source workflow

on:
  push:
    branches:
      - users/amrutha/linux-vip-shared-workflow
      - users/amrutha/test-vip-build-action
  workflow_dispatch:
    inputs:
      labview_version:
        description: LabVIEW Docker image version
        required: true
        default: 2026q1
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build-ppl:
    name: Build PPL with existing Linux workflow
    uses: ./.github/workflows/build-lvlibp-linux-container.yml
    with:
      labview_version: ${{ inputs.labview_version || '2026q1' }}

  build-vip:
    name: Build VIP with shared action
    needs: build-ppl
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download PPL artifact
        uses: actions/download-artifact@v5
        with:
          pattern: lv_icon_x64_v${{ needs.build-ppl.outputs.major }}.${{ needs.build-ppl.outputs.minor }}.${{ needs.build-ppl.outputs.patch }}.${{ needs.build-ppl.outputs.build }}_${{ needs.build-ppl.outputs.labview_version }}-linux
          merge-multiple: true
          path: builds/ppl-artifact

      # Calls the action directly: the reusable workflow on this branch pins the action to @actions, where it does not exist yet.
      - name: Build VIP in LabVIEW Linux container
        id: build
        uses: ni/open-source/build-vip-docker-linux@users/amrutha/build-vip-docker-linux
        with:
          vipb_path: Tooling/deployment/NI Icon editor.linux.shared.vipb
          labview_version: ${{ needs.build-ppl.outputs.labview_version }}
          pre_build_script: Tooling/Prepare-Vip-Container.sh
          output_directory: builds/VI Package
          log_directory: builds/logs/linux-vip-shared
          vipm_serial_number: ${{ secrets.VIPM_SERIAL_NUMBER }}
          vipm_full_name: ${{ secrets.VIPM_FULL_NAME }}
          vipm_email: ${{ secrets.VIPM_EMAIL }}

      - name: Upload VIP
        uses: actions/upload-artifact@v6
        with:
          name: linux-vip-shared-${{ github.run_id }}
          path: builds/VI Package/*.vip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-vip-shared-logs-${{ github.run_id }}
          path: builds/logs/linux-vip-shared/**
          if-no-files-found: warn
          retention-days: 14
