name: Build LVLIBP with Github Runner (Windows x86)

on:
  push:
    branches:
      - main
      - develop
      - release-alpha/*
      - release-beta/*
      - release-rc/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
      - release-alpha/*
      - release-beta/*
      - release-rc/*
      - hotfix/*
  workflow_dispatch:

jobs:
  build-lvlibp-win32:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup NI Package Manager
        uses: ni/open-source/setup-nipm@actions
        with:
          log_level: 'DEBUG'
      
      - name: Setup LabVIEW
        uses: ni/open-source/setup-labview@actions
        with:
          labview_iso_url: 'https://download.ni.com/support/softlib/labview/labview_development_system/2025_Q3/ni-labview-2025-community-x86_25.3.3_offline.iso'
          timeout_seconds: 1800
          serial_number: ${{ secrets.LABVIEW_SERIAL_NUMBER }}
          package_id: 'LabVIEW_COM_PKG 25.0300'
          log_level: 'DEBUG'

      - name: Configure LabVIEW
        uses: ni/open-source/configure-labview@actions
        with:
          labview_version: '2025'
          log_level: 'DEBUG'

      - name: Get Version from Git
        id: version
        shell: pwsh
        run: |
          git fetch --tags
          $allTags = git tag -l "v*.*.*" --sort=-version:refname 2>$null
          $tag = if ($allTags) { $allTags | Select-Object -First 1 } else { $null }
          
          Write-Host "Latest tag in repository: '$tag'"
          
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "No version tag found. Using fallback version 0.0.0.0"
            $major = 0
            $minor = 0
            $patch = 0
            $build = 0
          } elseif ($tag -match '^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$') {
            $major = $Matches[1]
            $minor = $Matches[2]
            $patch = $Matches[3]
            $build = if ($Matches[4]) { $Matches[4] } else { 0 }
            Write-Host "Parsed version from tag '$tag': $major.$minor.$patch.$build"
          } else {
            Write-Warning "Tag '$tag' does not match pattern v{major}.{minor}.{patch}[.{build}]. Using fallback 0.0.0.0"
            $major = 0
            $minor = 0
            $patch = 0
            $build = 0
          }
          
          $build = $env:GITHUB_RUN_NUMBER
          Write-Host "Version: $major.$minor.$patch.$build"
          
          echo "major=$major" >> $env:GITHUB_OUTPUT
          echo "minor=$minor" >> $env:GITHUB_OUTPUT
          echo "patch=$patch" >> $env:GITHUB_OUTPUT
          echo "build=$build" >> $env:GITHUB_OUTPUT

      - name: Build PPL
        uses: ni/open-source/build-lvlibp-github-hosted-windows@actions
        with:
          minimum_supported_lv_version: '2025'
          supported_bitness: '32'
          project_path: 'lv_icon_editor.lvproj'
          target_name: 'My Computer'
          build_spec_name: 'Editor Packed Library'
          major: ${{ steps.version.outputs.major }}
          minor: ${{ steps.version.outputs.minor }}
          patch: ${{ steps.version.outputs.patch }}
          build: ${{ steps.version.outputs.build }}
          commit: ${{ github.sha }}
          log_level: 'INFO'

      - name: Upload Built PPL
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: lv_icon_x86_v${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}.${{ steps.version.outputs.build }}
          path: builds/*.lvlibp
          retention-days: 7

      - name: Upload Build Logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-logs
          path: build-logs/*.log
          retention-days: 3