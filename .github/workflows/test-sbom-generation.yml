name: Test SBOM Generation

on:
  workflow_dispatch:

jobs:
  sbom-test:
    name: Build and publish SBOM
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # v5 does not exist; use v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve LabVIEW version
        id: resolve
        shell: pwsh
        run: |
          $isoMapFile = Join-Path $PWD '.lv-iso-map.json'
          if (-not (Test-Path $isoMapFile)) {
            throw ".lv-iso-map.json file not found"
          }

          $isoMap = Get-Content $isoMapFile -Raw | ConvertFrom-Json
          $lvVersion = $isoMap.default

          if (-not $isoMap.versions.PSObject.Properties[$lvVersion]) {
            throw "Version $lvVersion not found in .lv-iso-map.json"
          }

          if ($lvVersion -match '^(\d{4})q[13]$') {
            $lvYear = $Matches[1]
          } else {
            throw "Invalid version format: $lvVersion"
          }

          # Use x86/32-bit — the ISO map only contains x86 entries
          $bitness = '32'
          $arch    = 'x86'

          $platformData = $isoMap.versions.$lvVersion.windows
          $isoUrl    = $platformData.$arch
          $packageId = $platformData.package_id

          if ([string]::IsNullOrWhiteSpace($isoUrl)) {
            throw "No ISO URL found for $lvVersion on windows/$arch"
          }

          "LV_VERSION=$lvVersion" >> $env:GITHUB_ENV
          "LV_YEAR=$lvYear"       >> $env:GITHUB_ENV
          "ISO_URL=$isoUrl"       >> $env:GITHUB_ENV
          "PACKAGE_ID=$packageId" >> $env:GITHUB_ENV
          "BITNESS=$bitness"      >> $env:GITHUB_ENV
          "ARCH=$arch"            >> $env:GITHUB_ENV

      - name: Setup NI Package Manager
        uses: ni/open-source/setup-nipm@actions
        with:
          log_level: 'DEBUG'

      - name: Setup LabVIEW
        uses: ni/open-source/setup-labview@actions
        with:
          labview_iso_url: ${{ env.ISO_URL }}
          timeout_seconds: 1800
          serial_number: ${{ secrets.LABVIEW_SERIAL_NUMBER }}
          package_id: ${{ env.PACKAGE_ID }}
          log_level: 'DEBUG'

      - name: Configure LabVIEW
        uses: ni/open-source/configure-labview@actions
        with:
          labview_version: ${{ env.LV_YEAR }}
          log_level: 'DEBUG'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          git fetch --tags
          $tag = (git tag -l "v*.*.*" --sort=-version:refname | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $major = 0; $minor = 0; $patch = 0; $build = 0
          } else {
            $cleanTag = $tag -replace '-.*$', ''
            if ($cleanTag -match '^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$') {
              $major = $Matches[1]; $minor = $Matches[2]
              $patch = $Matches[3]; $build = if ($Matches[4]) { $Matches[4] } else { 0 }
            } else {
              $major = 0; $minor = 0; $patch = 0; $build = 0
            }
          }
          "major=$major" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "patch=$patch" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT

      # The build spec's SBOM checkbox emits builds/<name>.cdx.sbom.json
      # alongside the .lvlibp — no separate vipm sbom command needed.
      - name: Build PPL (with SBOM)
        uses: ni/open-source/build-spec-github-hosted-windows@actions
        with:
          minimum_supported_lv_version: ${{ env.LV_YEAR }}
          supported_bitness: ${{ env.BITNESS }}
          project_path: 'lv_icon_editor.lvproj'
          target_name: 'My Computer'
          build_spec_name: 'Editor Packed Library'
          major: ${{ steps.version.outputs.major }}
          minor: ${{ steps.version.outputs.minor }}
          patch: ${{ steps.version.outputs.patch }}
          build: ${{ steps.version.outputs.build }}
          commit: ${{ github.sha }}
          log_level: 'INFO'

      - name: Ensure build output directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ".\builds" | Out-Null

      - name: Verify SBOM exists
        shell: pwsh
        run: |
          # The build spec emits a .cdx.sbom.json next to the .lvlibp
          $sbomFiles = Get-ChildItem -Path '.\builds' -Filter '*.cdx.sbom.json' -ErrorAction SilentlyContinue
          if (-not $sbomFiles) {
            throw "No .cdx.sbom.json found in builds\. Ensure 'Generate SBOM' is enabled in the build spec."
          }
          $sbomFiles | ForEach-Object { Write-Host "SBOM verified: $($_.FullName)" }

      - name: Upload built artifact and SBOM
        uses: actions/upload-artifact@v4    # v6 does not exist; use v4
        if: success()
        with:
          name: sbom-validation-${{ github.run_number }}
          path: |
            builds/*.lvlibp
            builds/*.cdx.sbom.json
          retention-days: 7
