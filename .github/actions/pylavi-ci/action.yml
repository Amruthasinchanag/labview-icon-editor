name: Pylavi CI

description: Deterministic pylavi validation without runner-cli dependency.

inputs:
  validate_args:
    description: Arguments passed to vi_validate.
    required: false
    default: --gt 19 --lt 21 --no-suspend-on-run --breakpoints --no-code --no-absolute-path
  label:
    description: Label to use in emitted report artifacts.
    required: false
    default: linux-container
  report_only:
    description: Do not fail the step when vi_validate reports findings.
    required: false
    default: 'true'
  absolute_roots:
    description: Semicolon-delimited absolute roots for visibility in summary metadata.
    required: false
    default: ''

outputs:
  status:
    description: pass, warn, or fail status for the pylavi run.
    value: ${{ steps.run.outputs.status }}
  exit_code:
    description: vi_validate exit code.
    value: ${{ steps.run.outputs.exit_code }}
  log_path:
    description: Absolute path to vi_validate log file.
    value: ${{ steps.run.outputs.log_path }}
  offenders_path:
    description: Absolute path to offenders JSON file.
    value: ${{ steps.run.outputs.offenders_path }}
  summary_path:
    description: Absolute path to summary JSON file.
    value: ${{ steps.run.outputs.summary_path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install pylavi
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install pylavi

    - id: run
      name: Run pylavi validation
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        function Test-Enabled {
          param([string]$Value)
          if ([string]::IsNullOrWhiteSpace($Value)) { return $false }
          $normalized = $Value.Trim().ToLowerInvariant()
          return $normalized -in @('1', 'true', 'yes')
        }

        $repoRoot = $env:GITHUB_WORKSPACE
        $label = [string]'${{ inputs.label }}'
        if ([string]::IsNullOrWhiteSpace($label)) {
          $label = 'linux-container'
        }

        $validateArgsRaw = [string]'${{ inputs.validate_args }}'
        if ([string]::IsNullOrWhiteSpace($validateArgsRaw)) {
          $validateArgsRaw = '--gt 19 --lt 21 --no-suspend-on-run --breakpoints --no-code --no-absolute-path'
        }

        $validateArgs = @($validateArgsRaw -split '\s+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
        if ($validateArgs.Count -eq 0) {
          throw 'validate_args resolved to an empty argument list.'
        }

        $runRoot = Join-Path $env:RUNNER_TEMP ("pylavi-{0}" -f $label)
        New-Item -Path $runRoot -ItemType Directory -Force | Out-Null

        $logPath = Join-Path $runRoot 'vi_validate.log'
        $offendersPath = Join-Path $runRoot 'pylavi-offenders.json'
        $summaryPath = Join-Path $runRoot 'pylavi-summary.json'

        $statusRoot = Join-Path $repoRoot 'builds/status'
        New-Item -Path $statusRoot -ItemType Directory -Force | Out-Null
        $statusSummaryPath = Join-Path $statusRoot ("pylavi-summary.{0}.json" -f $label)

        $commandOutput = & vi_validate @validateArgs 2>&1
        $exitCode = $LASTEXITCODE
        $outputLines = @($commandOutput | ForEach-Object { $_.ToString() })
        $outputLines | Set-Content -Path $logPath -Encoding utf8

        $failLines = @($outputLines | Where-Object { $_ -like 'FAIL:*' })
        $offenders = @()
        for ($index = 0; $index -lt $failLines.Count; $index++) {
          $offenders += [pscustomobject]@{
            id = $index + 1
            line = [string]$failLines[$index]
          }
        }

        $offendersReport = [ordered]@{
          generated_utc = (Get-Date).ToUniversalTime().ToString('o')
          label = $label
          command = "vi_validate $validateArgsRaw"
          offender_count = $offenders.Count
          offenders = $offenders
        }
        $offendersReport | ConvertTo-Json -Depth 8 | Set-Content -Path $offendersPath -Encoding utf8

        $reportOnly = Test-Enabled '${{ inputs.report_only }}'
        $absoluteRoots = @([string]'${{ inputs.absolute_roots }}' -split ';' | ForEach-Object { $_.Trim() } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

        $status = 'pass'
        if ($exitCode -ne 0) {
          if ($reportOnly) {
            $status = 'warn'
          } else {
            $status = 'fail'
          }
        }

        $summary = [ordered]@{
          generated_utc = (Get-Date).ToUniversalTime().ToString('o')
          status = $status
          exit_code = $exitCode
          label = $label
          command = "vi_validate $validateArgsRaw"
          report_only = $reportOnly
          absolute_roots = $absoluteRoots
          offender_count = $offenders.Count
          offenders_path = $offendersPath
          log_path = $logPath
        }

        $summary | ConvertTo-Json -Depth 8 | Set-Content -Path $summaryPath -Encoding utf8
        $summary | ConvertTo-Json -Depth 8 | Set-Content -Path $statusSummaryPath -Encoding utf8

        "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "log_path=$logPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "offenders_path=$offendersPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "summary_path=$summaryPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

        if ($status -eq 'warn') {
          Write-Warning "pylavi reported findings in report-only mode for label '$label'."
        }

        if ($status -eq 'fail') {
          throw "pylavi composite gate failed for label '$label'."
        }
