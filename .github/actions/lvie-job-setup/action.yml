name: LVIE Job Setup
description: Standard setup for self-hosted LabVIEW jobs (checkout, runner sanity, lock, worktree).
inputs:
  checkout:
    description: Run actions/checkout.
    required: false
    default: 'true'
  fetch_depth:
    description: Fetch depth for actions/checkout.
    required: false
    default: '0'
  runner_sanity:
    description: Run Tooling/Check-Runner.ps1.
    required: false
    default: 'true'
  safe_directory_scope:
    description: Git safe.directory scope (System or Global).
    required: false
    default: System
  acquire_lock:
    description: Acquire LabVIEW runner lock.
    required: false
    default: 'true'
  create_worktree:
    description: Create a short-path worktree and export REPO_ROOT/PROJECT_PATH.
    required: false
    default: 'true'
  bitness:
    description: LabVIEW bitness (required when create_worktree is true).
    required: false
  variant:
    description: Optional variant label for worktree naming.
    required: false
  worktree_root:
    description: Optional override for worktree root.
    required: false
  repo_root:
    description: Optional override for base repo root.
    required: false
runs:
  using: composite
  steps:
    - name: Checkout code
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch_depth }}
    - name: Runner sanity
      if: ${{ inputs.runner_sanity == 'true' }}
      shell: pwsh
      run: |
        pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\Tooling\Check-Runner.ps1" -SafeDirectoryScope ${{ inputs.safe_directory_scope }}
    - name: Acquire LabVIEW runner lock
      if: ${{ inputs.acquire_lock == 'true' }}
      shell: pwsh
      run: |
        pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\Tooling\RunnerLock.ps1" -Mode Acquire
    - name: Create short-path worktree
      if: ${{ inputs.create_worktree == 'true' }}
      shell: pwsh
      run: |
        $bitness = '${{ inputs.bitness }}'
        if ([string]::IsNullOrWhiteSpace($bitness)) {
          throw "bitness input is required when create_worktree is true."
        }
        $worktreeArgs = @('-Bitness', $bitness)
        $variant = '${{ inputs.variant }}'
        if (-not [string]::IsNullOrWhiteSpace($variant)) {
          $worktreeArgs += @('-Variant', $variant)
        }
        $worktreeRoot = '${{ inputs.worktree_root }}'
        if (-not [string]::IsNullOrWhiteSpace($worktreeRoot)) {
          $worktreeArgs += @('-WorktreeRoot', $worktreeRoot)
        }
        $repoRoot = '${{ inputs.repo_root }}'
        if (-not [string]::IsNullOrWhiteSpace($repoRoot)) {
          $worktreeArgs += @('-RepoRoot', $repoRoot)
        }
        & "$env:GITHUB_WORKSPACE\Tooling\New-CIWorktreeForJob.ps1" @worktreeArgs
